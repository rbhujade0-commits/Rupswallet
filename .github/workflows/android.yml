# Builds an installable APK on GitHub. Run it from: Actions > "Build Android APK" > Run workflow
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']          # pushing a tag like v1.0 also publishes a GitHub Release with the APK

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare the Android project (works with flat phone uploads)
        run: |
          echo "--- repo files ---"; ls -la
          if [ -f android/settings.gradle ] && [ -d android/app ]; then
            D=android
          else
            D=android_build
            M=$D/app/src/main
            mkdir -p $M/java/com/rupswallet/app $M/res/values $M/res/mipmap-anydpi $M/res/drawable-nodpi $M/assets/www
            for f in settings.gradle gradle.properties AndroidManifest.xml MainActivity.java styles.xml ic_launcher.xml; do
              if [ ! -f "$f" ]; then echo "ERROR: $f is missing from the repo"; exit 1; fi
            done
            cp settings.gradle gradle.properties $D/
            cp AndroidManifest.xml $M/
            cp MainActivity.java $M/java/com/rupswallet/app/
            cp styles.xml $M/res/values/
            cp ic_launcher.xml $M/res/mipmap-anydpi/
            cat > $D/build.gradle <<'GRADLE_ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE_ROOT
            cat > $D/app/build.gradle <<'GRADLE_APP'
          plugins {
              id 'com.android.application'
          }
          def ks = System.getenv("KEYSTORE_FILE")
          android {
              namespace 'com.rupswallet.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.rupswallet.app"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  if (ks) {
                      release {
                          storeFile file(ks)
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (ks) { signingConfig signingConfigs.release }
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.11.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          GRADLE_APP
          fi
          echo "Android project folder: $D"
          echo "ANDROID_DIR=$D" >> "$GITHUB_ENV"

      - name: Copy web app into the APK
        run: |
          mkdir -p $ANDROID_DIR/app/src/main/assets/www
          cp index.html $ANDROID_DIR/app/src/main/assets/www/
          cp manifest.webmanifest $ANDROID_DIR/app/src/main/assets/www/ || true
          cp -r icons $ANDROID_DIR/app/src/main/assets/www/ || true

      - name: Launcher icon
        run: |
          R=$ANDROID_DIR/app/src/main/res
          mkdir -p "$R/drawable-nodpi"
          # Easy path for phone uploads: put ic_launcher_foreground.png in the repo root
          if [ -f ic_launcher_foreground.png ]; then
            cp ic_launcher_foreground.png "$R/drawable-nodpi/ic_launcher_foreground.png"
            echo "Used icon from repo root"
          fi
          if [ ! -f "$R/drawable-nodpi/ic_launcher_foreground.png" ]; then
            mkdir -p "$R/drawable"
            cat > "$R/drawable/ic_launcher_foreground.xml" <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E90FF" android:pathData="M30,34h48a6,6 0 0 1 6,6v30a6,6 0 0 1 -6,6h-48a6,6 0 0 1 -6,-6v-30a6,6 0 0 1 6,-6z"/>
              <path android:fillColor="#34D399" android:pathData="M32,28h40v6h-40z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M70,52a5,5 0 1 0 0.01,0z"/>
          </vector>
          XML
            echo "Used fallback icon"
          fi

      - name: Bundle libraries so the app also opens offline
        working-directory: ${{ env.ANDROID_DIR }}/app/src/main/assets/www
        run: |
          mkdir -p lib
          V=10.12.2
          for f in app auth firestore; do
            curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-$f-compat.js" -o "lib/firebase-$f-compat.js"
          done
          curl -fsSL https://unpkg.com/react@18.3.1/umd/react.production.min.js -o lib/react.js
          curl -fsSL https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js -o lib/react-dom.js
          sed -i \
            -e "s#https://www.gstatic.com/firebasejs/$V/#lib/#g" \
            -e 's#https://unpkg.com/react@18.3.1/umd/react.production.min.js#lib/react.js#' \
            -e 's#https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js#lib/react-dom.js#' \
            index.html
          grep -o '<script[^>]*src="[^"]*"' index.html

      - name: Decode signing key (if you added secrets)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Build debug APK (no signing key set)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          echo "--- build output folders ---"
          find android -type d -path "*build/outputs*" 2>/dev/null || true
          echo "--- apk files ---"
          find . -name "*.apk" -type f 2>/dev/null || true
          APK=$(find . -name "*.apk" -type f -not -path "./out/*" 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "ERROR: no APK was produced. Look above for the Gradle log."
            exit 1
          fi
          echo "Using $APK"
          cp "$APK" out/RupsWallet.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RupsWallet-apk
          path: out/RupsWallet.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/RupsWallet.apk
